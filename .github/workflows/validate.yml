name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate package
        run: python3 scripts/validate_package.py
      - name: Check preservation examples
        run: python3 scripts/check_examples.py
      - name: Check behavioral smoke-test outputs
        run: python3 scripts/check_behavioral_outputs.py
      - name: Check DOI verifier without network
        run: python3 scripts/check_doi_verifier.py
      - name: Check Turkish editorial audit and semantic guardrails
        run: python3 scripts/check_style_audit.py
