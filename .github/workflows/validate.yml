name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional statistics dependencies for regression tests
        run: python3 -m pip install -r skills/turkish-clear-writing/requirements-statistics.txt
      - name: Validate package
        run: python3 scripts/validate_package.py
      - name: Check scientific methodology audit with synthetic protocols
        run: python3 scripts/check_methodology_audit.py
      - name: Check preservation examples
        run: python3 scripts/check_examples.py
      - name: Check behavioral smoke-test outputs
        run: python3 scripts/check_behavioral_outputs.py
      - name: Check DOI verifier without network
        run: python3 scripts/check_doi_verifier.py
      - name: Check Turkish editorial audit and semantic guardrails
        run: python3 scripts/check_style_audit.py
      - name: Check statistical workflow with synthetic data
        run: python3 scripts/check_statistical_analysis.py
      - name: Check all five publication charts with synthetic data
        run: python3 scripts/check_publication_figures.py
      - name: Check four advanced statistics modes with synthetic data
        run: python3 scripts/check_advanced_statistics.py
      - name: Verify model-linked factorial and mixed interaction figures
        run: python3 scripts/check_interaction_graphs.py
